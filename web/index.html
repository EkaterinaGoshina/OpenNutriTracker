<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    The viewport Flutter's engine adds on its own when a page has none: no
    zoom, so a quick second tap is never taken for a double-tap zoom. No
    viewport-fit=cover and a plain "black" status bar: the page stays inside
    the safe area. Drawing under the notch (cover + black-translucent) came
    with taps dropped in the iPhone home-screen app; to be confirmed.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1c1b1b">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Калории: дневник питания и подсчёт калорий.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Калории">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Калории</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The two canvas colours of AppPalette, for the page while the app loads. iOS
    takes the status bar colour of the home-screen app from the page background
    only at load; see ontSetPageColor below for what happens after that.
  -->
  <style>
    html, body { background-color: #1b1a18; }
    @media (prefers-color-scheme: light) {
      html, body { background-color: #f7f4ef; }
    }
  </style>
</head>
<body>
  <script>
    // Flutter web ignores CSS safe-area insets, so measure them here and let
    // Dart read them (lib/core/utils/web/web_safe_area_web.dart).
    window.ontSafeAreaJson = function () {
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;' +
        'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
      document.body.appendChild(probe);
      var cs = getComputedStyle(probe);
      var r = {
        // The status bar strip (below) lies over the top of the page.
        top: Math.max(parseFloat(cs.paddingTop) || 0, ontStatusStripHeight()),
        right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0,
        left: parseFloat(cs.paddingLeft) || 0
      };
      document.body.removeChild(probe);
      return JSON.stringify(r);
    };

    // The theme picked in the app can differ from the system one, so Dart
    // reports its canvas colour (lib/core/utils/web/web_page_color_web.dart).
    //
    // In the iPhone home-screen app iOS does not repaint the status bar when
    // the page background changes, and cannot see colours drawn on Flutter's
    // canvas: a dark theme on a light system kept a light status bar. It does
    // follow a fixed element at the very top. On the iOS 27.2 simulator it had
    // to be over the canvas and 12px did it; 4px, one hidden behind the canvas
    // or one mostly off screen did not. Taps pass through it.
    var ontStripHeight = 12;
    window.ontStatusStripHeight = function () {
      return window.navigator.standalone === true ? ontStripHeight : 0;
    };
    var ontStrip = null;
    window.ontSetPageColor = function (color) {
      document.documentElement.style.backgroundColor = color;
      document.body.style.backgroundColor = color;
      if (!ontStatusStripHeight()) return;
      if (!ontStrip) {
        ontStrip = document.createElement('div');
        ontStrip.setAttribute('aria-hidden', 'true');
        ontStrip.style.cssText = 'position:fixed;top:0;left:0;width:100%;' +
          'pointer-events:none;z-index:2147483647;height:' + ontStripHeight + 'px';
        document.body.appendChild(ontStrip);
      }
      ontStrip.style.backgroundColor = color;
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
